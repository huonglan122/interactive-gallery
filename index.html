<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thư viện các loài mèo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Thư Viện Mèo Tương Tác</h1>

    <!-- Phần tử hiển thị ảnh phóng to và văn bản -->
    <div id="image">
        Hover over an image below to display here.
    </div>

    <!-- Danh sách các loài mèo -->
    <div class="gallery">
        <img class="preview" 
             alt="Mèo Anh Lông Ngắn (British Shorthair)" 
             src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Mèo Muớp Dễ Thương (Tabby Cat)" 
             src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600&auto=format&fit=crop" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Mèo Mắt Xanh (Siamese Cat)" 
             src="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?w=600&auto=format&fit=crop" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">
    </div>
</body>
</html>
